name: kenroka-tests-${UBUNTU:-24.04}

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        BASE_IMAGE: ubuntu:${UBUNTU:-24.04}
    image: kenroka/server-systemd:${UBUNTU:-24.04}
    container_name: kenroka-server-${UBUNTU:-24.04}
    hostname: kenroka-server
    # systemd necesita cgroups reales; privileged ya le da /sys/fs/cgroup
    # escribible en Docker Desktop (cgroupns no es atributo válido aquí).
    privileged: true
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    environment:
      container: docker
    volumes:
      # secure-vps.sh NO se monta: run.sh lo copia dentro del contenedor en
      # cada reset, para que editar el archivo en el host a media corrida no
      # inyecte un script a medio escribir.
      - .:/tests:ro
      - ./.work/keys:/keys:ro
    networks:
      - testnet
    stop_signal: SIGRTMIN+3
    healthcheck:
      test: ["CMD", "systemctl", "is-system-running", "--quiet"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
      args:
        BASE_IMAGE: ubuntu:${UBUNTU:-24.04}
    image: kenroka/client-ssh:${UBUNTU:-24.04}
    container_name: kenroka-client-${UBUNTU:-24.04}
    volumes:
      - ./.work/keys:/keys:ro
    networks:
      - testnet
    depends_on:
      server:
        condition: service_started

networks:
  testnet:
    driver: bridge
